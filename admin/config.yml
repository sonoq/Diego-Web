backend:
  name: git-gateway
  branch: main

locale: es # Interfaz en español

media_folder: "images"
public_folder: "/images"

collections:
  - name: "config"
    label: "Configuración Genérica"
    delete: false
    editor:
      preview: false
    files:
      - name: "seo"
        label: "SEO y Metadatos"
        file: "index.html" # Por ahora guardamos en index.html, pero en campos específicos
        fields:
          - { label: "Título de la Web (Browser)", name: "meta_title", widget: "string" }
          - { label: "Descripción SEO", name: "meta_description", widget: "text" }
          - label: "Textos de Accesibilidad (ALT)"
            name: "alts"
            widget: "object"
            fields:
              - { label: "Alt Imagen Hero", name: "hero_image", widget: "string" }
              - { label: "Alt Imagen Retrato", name: "sobre_mi_image", widget: "string" }

  - name: "paginas"
    label: "Contenido de Páginas"
    delete: false
    create: false
    files:
      - name: "inicio"
        label: "Página de Inicio"
        file: "index.html"
        fields:
          - label: "Sección Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Subtítulo", name: "subtitle", widget: "string" }
              - { label: "Título (Diego...)", name: "title_html", widget: "string" }
              - { label: "Eslogan", name: "tagline", widget: "string" }
              - { label: "Texto Botón", name: "cta_text", widget: "string" }
              - { label: "Imagen Hero", name: "image", widget: "image" }

          - label: "Sobre Mí"
            name: "sobre_mi"
            widget: "object"
            fields:
              - { label: "Título Sección", name: "title", widget: "string" }
              - { label: "Imagen Retrato", name: "image", widget: "image" }
              - { label: "Párrafos", name: "paragraphs", widget: "list", field: { label: "Párrafo", name: "paragraph", widget: "text" } }

          - label: "Galería (Textos)"
            name: "galeria_textos"
            widget: "object"
            fields:
              - { label: "Título Sección", name: "title", widget: "string", default: "Galería" }
              - { label: "Cita / Frase", name: "quote", widget: "string" }

          - label: "Contacto"
            name: "contacto"
            widget: "object"
            fields:
              - { label: "Título Sección", name: "title", widget: "string" }
              - { label: "Texto Intro", name: "intro", widget: "text" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Ubicación Estudio", name: "estudio", widget: "string" }

  - name: "obras"
    label: "Obras (Galería)"
    label_singular: "Obra"
    folder: "_obras"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título / Etiqueta", name: "label", widget: "string" }
      - { label: "Año / Técnica", name: "year", widget: "string" }
      - { label: "Imagen", name: "image", widget: "image" }
      - { label: "Texto Alternativo (Accesibilidad)", name: "alt", widget: "string" }
