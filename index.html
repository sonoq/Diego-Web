<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" data-content="meta-description"
        content="Página web oficial de Diego Peribañez Villalba, escultor y pintor figurativo en Valencia. Obras en talla de madera policromada y óleo. Ganador del Certamen Nacional de Valdepeñas.">
    <meta name="keywords"
        content="Diego Peribañez, Diego Peribáñez Villalba, Escultor, Pintor Figurativo, Teruel, Valencia, Talla en madera, Arte contemporáneo, Retrato, Koré">
    <meta name="author" content="Diego Peribañez Villalba">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://diegoperibanez.es/">
    <meta property="og:title" content="Diego Peribañez Villalba — Escultor y Pintor">
    <meta property="og:description"
        content="Página oficial de Diego Peribañez Villalba, escultor y pintor figurativo. Explora su trayectoria, obras en madera policromada y óleo.">
    <meta property="og:image" content="https://diegoperibanez.es/images/portrait_new.jpg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://diegoperibanez.es/">
    <meta property="twitter:title" content="Diego Peribañez Villalba — Escultor y Pintor">
    <meta property="twitter:description"
        content="Página oficial de Diego Peribañez Villalba, escultor y pintor figurativo. Explora su trayectoria, obras en madera policromada y óleo.">
    <meta property="twitter:image" content="https://diegoperibanez.es/images/portrait_new.jpg">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://diegoperibanez.es/" />

    <title data-content="meta-title">Diego Peribañez Villalba — Escultor y Pintor Figurativo</title>

    <!-- Fonts and CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Diego Peribañez Villalba",
      "url": "https://diegoperibanez.es/",
      "image": "https://diegoperibanez.es/images/portrait_new.jpg",
      "jobTitle": "Escultor y Pintor Figurativo",
      "birthPlace": {
        "@type": "Place",
        "name": "Teruel, España"
      },
      "homeLocation": {
        "@type": "Place",
        "name": "Valencia, España"
      },
      "description": "Diego Peribañez Villalba es un escultor y pintor figurativo español, especializado en talla de madera policromada y óleo.",
      "knowsAbout": ["Escultura", "Pintura", "Madera policromada", "Retrato", "Arte contemporáneo"]
    }
    </script>
</head>

<body>

    <!-- Navigation -->
    <nav id="main-nav">
        <div class="nav-inner">
            <a href="#" class="nav-logo">DIEGO</a>
            <ul class="nav-links">
                <li><a href="#sobre-mi">Sobre mí</a></li>
                <li><a href="#galeria">Galería</a></li>
                <li><a href="#contacto">Contacto</a></li>
            </ul>
            <button id="nav-toggle" class="nav-toggle" aria-label="Abrir menú">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <!-- Hero Section -->
    <header id="hero" class="hero">
        <div class="hero-bg">
            <img data-content="hero-image"
                src="images/portrait.png"
                alt="Diego Peribañez muestra a Sofía de Grecia su cuadro Calle las Barcas, seleccionado por el Premio Reina Sofía"
                loading="eager">
            <div class="hero-overlay"></div>
        </div>
        <div class="hero-content fade-in">
            <p class="hero-subtitle" data-content="hero-subtitle"></p>
            <h1 class="hero-title" data-content="hero-title"></h1>
            <div class="hero-line"></div>
            <p class="hero-tagline" data-content="hero-tagline"></p>
            <a class="hero-cta" data-content="hero-cta"></a>
        </div>
    </header>

    <!-- Sobre mí -->
    <section id="sobre-mi" class="section sobre-mi">
        <div class="container">
            <div class="sobre-mi-grid">
                <div class="sobre-mi-image fade-in">
                    <img data-content="sobre-mi-image"
                        src="images/portrait_new.jpg"
                        alt="Retrato pictórico de Diego Peribáñez y su pareja">
                    <div class="image-accent"></div>
                </div>
                <div class="sobre-mi-text fade-in">
                    <h2 class="section-title" data-content="sobre-mi-title"></h2>
                    <div class="title-divider"></div>
                    <div data-content="sobre-mi-paragraphs"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- Galería -->
    <section id="galeria" class="section galeria">
        <div class="container">
            <h2 class="section-title fade-in" data-content="galeria-title"></h2>
            <div class="title-divider fade-in"></div>
            <p class="section-intro fade-in" data-content="galeria-quote"></p>
            <div class="carousel-wrapper">
                <button id="carousel-prev" class="carousel-btn prev-btn" aria-label="Anterior">&#10094;</button>
                <div class="gallery-grid" id="gallery-carousel">
                    <!-- Gallery items are injected dynamically by script.js -->
                </div>
                <button id="carousel-next" class="carousel-btn next-btn" aria-label="Siguiente">&#10095;</button>
            </div>
        </div>
    </section>

    <!-- Contacto -->
    <section id="contacto" class="section contacto">
        <div class="container">
            <h2 class="section-title fade-in" data-content="contacto-title"></h2>
            <div class="title-divider fade-in"></div>
            <div class="contacto-content fade-in">
                <p class="contacto-intro" data-content="contacto-intro"></p>
                <div class="contacto-grid">
                    <div class="contacto-item">
                        <span class="contacto-label">Email</span>
                        <a class="contacto-link" data-content="contacto-email"></a>
                    </div>
                    <div class="contacto-item">
                        <span class="contacto-label">Estudio</span>
                        <span class="contacto-value" data-content="contacto-estudio"></span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-inner">
                <span class="footer-logo">DIEGO</span>
                <span class="footer-copy">&copy; 2025 Diego Peribañez Villalba. Todos los derechos reservados.</span>
            </div>
        </div>
    </footer>

    <!-- Image Modal -->
    <div id="image-modal" class="modal">
        <span class="modal-close">&times;</span>
        <img class="modal-content" id="modal-img">
        <div id="modal-caption"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
